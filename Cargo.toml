[workspace]

[package]
name = "rs-ai-devops"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Ecosystem map + AI-agent context generator across GitHub/Bitbucket/Gitbucket/GitLab/Redmine (incl. RS-Chiketto), exporting CLAUDE.md/.cursorrules for Claude/Cursor/ChatGPT/Gemini/DeepSeek/Grok"
repository = "https://github.com/aon-co-jp/RS-AI-DevOps"

[lib]
name = "rs_ai_devops"
path = "src/lib.rs"

[[bin]]
name = "rs-ai-devops"
path = "src/main.rs"

[dependencies]
poem = { version = "3.1", features = ["static-files", "test"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
walkdir = "2"
regex = "1"

[dev-dependencies]
tempfile = "3"
